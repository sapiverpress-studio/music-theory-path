name: Build Android preview APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.build-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install compatible dependencies
        run: npm install

      - name: Validate source and Expo compatibility
        run: |
          npm run typecheck
          npx expo-doctor

      - name: Register or link Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest project:init --account sapiverforge --non-interactive

      - name: Submit installable APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
